# Runs the Docker image with its settings in one place.
#   cp .env.docker.example .env.docker   # then fill in APP_KEY and the rest
#   docker compose up -d --build
# See "Running with Docker" in README.md.

services:
  app:
    build: .
    image: tech-log
    container_name: techlog
    restart: unless-stopped
    ports:
      - "${TECHLOG_PORT:-8080}:80"
    env_file: .env.docker
    volumes:
      - storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  # The SQLite database, uploaded images and logs. Back this up.
  storage:
